name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly deep simulations, 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # project.pbxproj is gitignored; the project is always generated from project.yml.
      - name: Generate project
        run: xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          SIM=$(xcrun simctl list devices available | grep -E '^\s+iPhone' | head -1 | sed -E 's/^ +//; s/ \([A-F0-9-]+\) \((Booted|Shutdown)\).*$//')
          echo "name=$SIM" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $SIM"

      - name: Unit tests
        env:
          SIM_NAME: ${{ steps.sim.outputs.name }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project UNBOUND.xcodeproj \
            -scheme UNBOUND \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            2>&1 | tail -400

  device-build:
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # The device-arch compile catches errors the simulator build cannot.
      - name: Device-arch build (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project UNBOUND.xcodeproj \
            -scheme UNBOUND \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -200

  nightly-deep-sims:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          SIM=$(xcrun simctl list devices available | grep -E '^\s+iPhone' | head -1 | sed -E 's/^ +//; s/ \([A-F0-9-]+\) \((Booted|Shutdown)\).*$//')
          echo "name=$SIM" >> "$GITHUB_OUTPUT"

      # TEST_RUNNER_-prefixed env vars reach the test process; these arm the
      # full-year program simulation and the gate-key pacing harness, which are
      # skipped in the default (PR) run.
      - name: Full-year + pacing simulations
        env:
          SIM_NAME: ${{ steps.sim.outputs.name }}
          TEST_RUNNER_UNBOUND_YEAR_SIM_ENABLE_FULL_YEAR: "1"
          TEST_RUNNER_UNBOUND_YEAR_SIM_ENABLE_SHARDS: "1"
          TEST_RUNNER_UNBOUND_GATEKEY_PACING: "1"
        run: |
          set -o pipefail
          xcodebuild test \
            -project UNBOUND.xcodeproj \
            -scheme UNBOUND \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -only-testing:UNBOUNDTests/YearProgramSimulationTests \
            -only-testing:UNBOUNDTests/GateKeyPacingSimulationTests \
            2>&1 | tail -400
