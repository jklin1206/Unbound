function fmtVal(metric,val,name){
  if(metric==="reps") return `<span class="v">${val}</span>`;
  if(metric==="seconds") return `<span class="v">${val}</span><span class="unit">s</span>`;
  if(name&&name.toLowerCase().includes("weighted")) return `<span class="unit">+</span><span class="v">${Math.round(val*100)}</span><span class="unit">%</span>`;
  return `<span class="unit">×</span><span class="v">${val.toFixed(2)}</span>`;
}
function fmtRatio(v){return v<=0?`<span class="unit">—</span>`:`<span class="unit">×</span><span class="v">${v.toFixed(2)}</span>`;}

function rankHead(firstLabel){
  let h=`<thead><tr><th class="skill">${firstLabel}</th>`;
  RANKS.forEach(r=>h+=`<th style="color:${r.c}">${r.n}<span class="ord">${r.o}</span></th>`);
  return h+`</tr></thead>`;
}
function skillTable(rows,firstLabel){
  let body="<tbody>";
  rows.forEach(row=>{
    const tx=row.tierEx;
    const dag=tx?`<span class="dag" title="movement changes by rank">†</span>`:"";
    body+=`<tr><td class="skill" title="${row.name}">${row.name}${dag}</td>`;
    row.vals.forEach((v,i)=>{
      let cls="",tag="";
      if(tx){
        const changed = i===0 || tx[i]!==tx[i-1];
        if(changed && i>0){cls="tx";}            // accent where the movement changes
        if(changed){tag=`<span class="ex">${tx[i]}</span>`;}
      }
      body+=`<td class="${cls}">${fmtVal(row.metric,v,tx?tx[i]:row.name)}${tag}</td>`;
    });
    body+=`</tr>`;
  });
  return `<div class="tablewrap"><table>${rankHead(firstLabel)}${body}</tbody></table></div>`;
}
function ratioTable(obj,firstLabel,fam){
  let body="<tbody>";
  Object.keys(obj).forEach(k=>{
    ["m","f"].forEach(sx=>{
      const vals=obj[k][sx];
      const label = fam ? `${k} <span class="unit">${sx==="m"?"M":"F"}</span>` : `${k[0].toUpperCase()+k.slice(1)} <span class="unit">${sx==="m"?"M":"F"}</span>`;
      body+=`<tr><td class="skill">${label}</td>`;
      vals.forEach(v=>body+=`<td>${fmtRatio(v)}</td>`);
      body+=`</tr>`;
    });
  });
  return `<div class="tablewrap"><table>${rankHead(firstLabel)}${body}</tbody></table></div>`;
}

const blurbs={Pull:"bars, rows, levers, muscle-ups",Push:"push-ups, dips, HSPU, one-arm",Core:"raises, holds, levers",Handstand:"balances & presses",Planche:"the straight-arm lean",Legs:"squats, pistols, nordics","One-arm handstand":"the apex line"};
let toc="";
order.forEach(k=>toc+=`<div class="tocc"><span class="c">${DATA.clusters[k].length}</span><div class="n">${k}</div><div class="d">${blurbs[k]||""}</div></div>`);
toc+=`<div class="tocc"><span class="c">5</span><div class="n">Barbell compounds</div><div class="d">squat · dead · bench · OHP · row (×BW)</div></div>`;
toc+=`<div class="tocc"><span class="c">8</span><div class="n">Accessories</div><div class="d">curl · triceps · legs · calf · hip thrust (×BW)</div></div>`;
SLIDES.push(`<section class="slide">
  <div class="eyebrow">The standards</div>
  <h2>Every movement, re-laddered</h2>
  <div class="toc">${toc}</div>
  <p class="note" style="margin-top:1.1rem">The next slides give every row. Rows marked <b>†</b> are the feats whose low ranks are now filled by a lead-up movement (shown in the cells).</p>
</section>`);

// cluster tables
order.forEach(k=>{
  SLIDES.push(`<section class="slide">
    <div class="eyebrow">Bodyweight standards · earnable from Initiate</div>
    <h2>${k}<span class="cnt">${DATA.clusters[k].length} MOVEMENTS</span></h2>
    ${skillTable(DATA.clusters[k],"Movement")}
    ${legend}
  </section>`);
});

// gym + acc
SLIDES.push(`<section class="slide">
  <div class="eyebrow">Loaded standards · × bodyweight</div>
  <h2>Barbell compounds<span class="cnt">LOAD ÷ BODYWEIGHT</span></h2>
  ${ratioTable(DATA.gym,"Lift (heaviest working set)",false)}
  <div class="note">Each cell = required <b>load ÷ bodyweight</b>, by sex. These already start at Initiate (T0 = the lightest real bar). Unchanged by this proposal.</div>
</section>`);
SLIDES.push(`<section class="slide">
  <div class="eyebrow">Loaded standards · × bodyweight</div>
  <h2>Accessory families<span class="cnt">8 FAMILIES · ×BW</span></h2>
  ${ratioTable(DATA.acc,"Accessory family",true)}
  <div class="note">Any member exercise ranks on its family's ratio table (load ÷ bodyweight), by sex. Unchanged by this proposal.</div>
</section>`);

// closing - to tune
SLIDES.push(`<section class="slide">
  <div class="eyebrow">Before we touch code</div>
  <h2>What's a dial, what's a decision</h2>
  <div class="closing">
    <div class="steps">
      <div class="step"><div class="n">1</div><div class="b"><b>Lead-up per rank.</b> Right now one primary lead-up fills a feat's whole low span. We could ramp through several (e.g. front lever: tuck → straddle → full) for a smoother climb.</div></div>
      <div class="step"><div class="n">2</div><div class="b"><b>Novice floor + rescale.</b> With Initiate now earned (not free), decide how low the lowest bar sits and rescale the curve so Initiate feels like a real first win.</div></div>
      <div class="step"><div class="n">3</div><div class="b"><b>Initiate trigger.</b> Confirm the rule: any cleared lowest standard = Initiate on that move; truly no logged proof = Unranked.</div></div>
      <div class="step"><div class="n">4</div><div class="b"><b>Then code.</b> This is the model. On sign-off I wire it into RankService / the standards tables / tests in the worktree.</div></div>
    </div>
    <div class="summary">
      <div class="q">Your call, captured</div>
      <div class="a">Unranked is the only empty state. Initiate is earned. Nothing is locked.</div>
      <p>Every one of the ${countAll()} skills now has a real standard at every rank. Tell me where the lead-ups or the floor feel off and I'll adjust the preview before any app change.</p>
    </div>
  </div>
</section>`);

const deck=document.getElementById("deck");
deck.innerHTML=SLIDES.join("");
const slides=[...deck.querySelectorAll(".slide")];
const dots=document.getElementById("dots");
slides.forEach((_,i)=>{const b=document.createElement("button");b.onclick=()=>go(i);dots.appendChild(b);});
document.getElementById("tot").textContent=slides.length;
let idx=0;
function go(i){idx=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,j)=>s.classList.toggle("active",j===idx));[...dots.children].forEach((d,j)=>d.classList.toggle("on",j===idx));document.getElementById("cur").textContent=idx+1;document.getElementById("bar").style.width=((idx+1)/slides.length*100)+"%";slides[idx].scrollTop=0;}
document.getElementById("next").onclick=()=>go(idx+1);
document.getElementById("prev").onclick=()=>go(idx-1);
addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="PageDown"){go(idx+1);e.preventDefault();}if(e.key==="ArrowLeft"||e.key==="PageUp"){go(idx-1);e.preventDefault();}if(e.key==="Home")go(0);if(e.key==="End")go(slides.length-1);});
go(0);
</script>
</body>
</html>
