function fmtSkill(metric,val,name){
  if(metric==="reps") return `<span class="v">${val}</span>`;
  if(metric==="seconds") return `<span class="v">${val}</span><span class="unit">s</span>`;
  if(name.toLowerCase().includes("weighted")) return `<span class="unit">+</span><span class="v">${Math.round(val*100)}</span><span class="unit">%</span>`;
  return `<span class="unit">×</span><span class="v">${val.toFixed(2)}</span>`;
}
function fmtRatio(v){return v<=0?`<span class="unit">—</span>`:`<span class="unit">×</span><span class="v">${v.toFixed(2)}</span>`;}
function floorIndex(vals){let i=0;while(i+1<vals.length&&vals[i+1]===vals[0])i++;return i;}

function rankHead(firstLabel){
  let h=`<thead><tr><th class="skill">${firstLabel}</th>`;
  RANKS.forEach(r=>h+=`<th style="color:${r.c}">${r.n}<span class="ord">${r.o}</span></th>`);
  return h+`</tr></thead>`;
}
function skillTable(rows,firstLabel){
  let body="<tbody>";
  rows.forEach(row=>{
    const fi=floorIndex(row.vals); const isFeat=!row.tierEx && fi>0;
    const dag=row.tierEx?`<span class="dag" title="progression ladder - movement changes by tier">†</span>`:"";
    body+=`<tr><td class="skill" title="${row.name}">${row.name}${dag}</td>`;
    row.vals.forEach((v,i)=>{
      let cls="";
      if(isFeat&&i<fi)cls="locked"; else if(isFeat&&i===fi)cls="floor";
      const style=cls==="floor"?`style="--fc:${RANKS[i].hex}"`:"";
      body+=`<td class="${cls}" ${style}>${fmtSkill(row.metric,v,row.name)}</td>`;
    });
    body+=`</tr>`;
  });
  return `<div class="tablewrap"><table>${rankHead(firstLabel)}${body}</tbody></table></div>`;
}
function ratioTable(obj,firstLabel,fam){
  let body="<tbody>";
  Object.keys(obj).forEach(k=>{
    ["m","f"].forEach(sx=>{
      const vals=obj[k][sx]||obj[k][sx];
      const label = fam ? `${k} <span class="unit">${sx==="m"?"M":"F"}</span>` : `${k[0].toUpperCase()+k.slice(1)} <span class="unit">${sx==="m"?"M":"F"}</span>`;
      body+=`<tr><td class="skill">${label}</td>`;
      vals.forEach(v=>body+=`<td>${fmtRatio(v)}</td>`);
      body+=`</tr>`;
    });
  });
  return `<div class="tablewrap"><table>${rankHead(firstLabel)}${body}</tbody></table></div>`;
}

const slides=[...deck.querySelectorAll(".slide")];
const dots=document.getElementById("dots");
slides.forEach((_,i)=>{const b=document.createElement("button");b.onclick=()=>go(i);dots.appendChild(b);});
document.getElementById("tot").textContent=slides.length;
let idx=0;
function go(i){idx=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,j)=>s.classList.toggle("active",j===idx));[...dots.children].forEach((d,j)=>d.classList.toggle("on",j===idx));document.getElementById("cur").textContent=idx+1;document.getElementById("bar").style.width=((idx+1)/slides.length*100)+"%";slides[idx].scrollTop=0;}
document.getElementById("next").onclick=()=>go(idx+1);
document.getElementById("prev").onclick=()=>go(idx-1);
addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="PageDown"){go(idx+1);e.preventDefault();}if(e.key==="ArrowLeft"||e.key==="PageUp"){go(idx-1);e.preventDefault();}if(e.key==="Home")go(0);if(e.key==="End")go(slides.length-1);});
go(0);
</script>
</body>
</html>
